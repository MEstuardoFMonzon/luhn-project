services:
  db:
    image: postgres:15-alpine
    container_name: luhn_db_preprod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luhndb_preprod
    volumes:
      - db_data_preprod:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - luhn_network_preprod

  adminer:
    image: adminer
    container_name: luhn_adminer_preprod
    ports:
      - "8082:8080"
    networks:
      - luhn_network_preprod

  backend:
    build: ./backend
    container_name: luhn_backend_preprod
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: luhndb_preprod
    ports:
      - "3001:3000"
    depends_on:
      - db
    networks:
      - luhn_network_preprod

  frontend:
    build: ./frontend
    container_name: luhn_frontend_preprod
    ports:
      - "8083:80"
    depends_on:
      - backend
    networks:
      - luhn_network_preprod

networks:
  luhn_network_preprod:
    driver: bridge

volumes:
  db_data_preprod: