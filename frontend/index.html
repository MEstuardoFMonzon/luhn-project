<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador Algoritmo de Luhn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { color: #1a1a2e; margin-bottom: 8px; font-size: 22px; }
    p { color: #666; margin-bottom: 24px; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #4361ee; }
    button {
      width: 100%;
      padding: 12px;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #3451d1; }
    .resultado {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      display: none;
    }
    .valido { background: #d4edda; color: #155724; }
    .invalido { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Algoritmo de Luhn</h1>
    <p>Ingresa un número para validar</p>
    <input type="text" id="numero" placeholder="Ej: 4532015112830366" />
    <button onclick="validar()">Validar</button>
    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    const BACKEND_URL = window.BACKEND_URL || 'http://localhost:3000';

    async function validar() {
      const numero = document.getElementById('numero').value.trim();
      const resultadoDiv = document.getElementById('resultado');

      if (!numero) {
        alert('Por favor ingresa un número');
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/validar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numero })
        });

        const data = await res.json();
        resultadoDiv.style.display = 'block';

        if (data.valido) {
          resultadoDiv.className = 'resultado valido';
          resultadoDiv.textContent = '✅ Número válido según el Algoritmo de Luhn';
        } else {
          resultadoDiv.className = 'resultado invalido';
          resultadoDiv.textContent = '❌ Número no válido según el Algoritmo de Luhn';
        }
      } catch (err) {
        resultadoDiv.style.display = 'block';
        resultadoDiv.className = 'resultado invalido';
        resultadoDiv.textContent = '⚠️ Error al conectar con el servidor';
      }
    }
  </script>
</body>
</html>
